spring:
  data:
    redis:
      host: ${spring.redis.host:localhost}
      port: ${spring.redis.port:6379}
      channel:
        pending_operation: pending_operation_test
        checking_balance: checking_balance

  datasource:
    url: jdbc:tc:postgresql:latest:///testdb
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  liquibase:
    enabled: true

retry:
  retry: 1
  delay: 0

currency-api:
  url: http://localhost:12123/
  api-key: TEST_API_KEY
  base-currency: EUR
  redis-key: currencyRates
  cron: "00 30 09 * * *"
  timeout:
    connection: 5000
    read: 1000
