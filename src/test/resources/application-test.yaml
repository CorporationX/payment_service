spring:
  data:
    redis:
      host: ${spring.redis.host:localhost}
      port: ${spring.redis.port:6379}
      channel:
        channel:
          auth-payment-request: auth-payment-request
          auth-payment-response: auth-payment-response
          cancel-payment-request: cancel-payment-request
          cancel-payment-response: cancel-payment-response
          clearing-payment-request: clearing-payment-request
          clearing-payment-response: clearing-payment-response
          error-payment-request: error-payment-request
          error-payment-response: error-payment-response

  datasource:
    url: jdbc:tc:postgresql:latest:///testdb
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  liquibase:
    enabled: true

retry:
  retry: 1
  delay: 0

currency-api:
  url: http://localhost:12123/
  api-key: TEST_API_KEY
  base-currency: EUR
  redis-key: currencyRates
  cron: "00 30 09 * * *"
  timeout:
    connection: 5000
    read: 1000
