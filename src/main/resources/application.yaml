spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: false


server:
  port: 9080

currency:
  exchange:
    url: https://openexchangerates.org
    appId: dcc217e8e3c54847a1a4142ba07bb878
    base: USD
    commissionPercent: 1.0

logging:
  level:
    root: info