server:
  port: 9080

spring:
  config:
    import: 'optional:consul:'
  application:
    name: payment-service
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery: payment-service-i1

logging:
  file:
    name: logs/payment-service.log
  level:
    root: info

spring:
  config:
    import:
      - optional:file:.env[.properties]

# Settings for currency rates
currency:
  rates:
    fetch-cron: "0 0 * * * ?"
    base: "EUR"

exchange_rates_api:
  key: ${EXCHANGE_RATES_API_KEY:defaultKey}
  base_url: "https://api.exchangeratesapi.io/v1/"


open_exchange_api:
  base-url: https://openexchangerates.org/api/
  app-id: ${OPEN_EXCHANGE_API_APP_ID}

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: "*"
    health:
      show-details: always

  tracing:
    enabled: false
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans