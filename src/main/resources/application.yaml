spring:
  config:
    import: optional:classpath:application.properties

  jackson:
    default-property-inclusion: non_null

  profiles:
    active: ${APP_ENV}

server:
  port: 9080

logging:
  level:
    root: info
schedule:
  current-rate-cron: "0 0 12 * * *"
current-rate:
  header: "Accept"
  values: "application/json"
  max-attempts: 3
  count-invoke: 3
  retry-delay: 2000
  base-url-rate: "https://www.cbr-xml-daily.ru/daily"



openexchangerates:
  url: https://openexchangerates.org
  app-id: ${OPEN_EXCHANGE_APP_ID}

app:
  commission-rate: 0.01
  target-currency: RUB
  verification-code:
    min: 1000
    max: 10000