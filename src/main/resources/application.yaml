spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    kafka:
      bootstrap-servers: localhost:9092
      consumer:
        group-id: payment-group
        auto-offset-reset: earliest
      producer:
        acks: all
        enable-idempotence: true
        delivery-timeout-ms: 5000
      topics:
        payment-operation:
          name: "payment-operation-topic"
          partitions: 3
          replicas: 1
        payment-response:
          name: "payment-response-topic"
          partitions: 3
          replicas: 1

  profiles:
    active: local

server:
  port: 9080

logging:
  level:
    root: debug

currency:
  rate:
    update:
      cron: "0 0 0 * * *" # Каждый день в полночь

exchangerates:
  api:
    url: "http://api.exchangeratesapi.io/v1/latest"
    access_key: " API_KEY"
    base: "EUR"
    symbols: "GBP,JPY,USD,RUB"

retry:
  maxAttempts: 5
  delay: 2000

webclient:
  connect-timeout: 1000
  read-timeout: 2000
  write-timeout: 2000

thread-pool-setting:
  request-force-confirming:
    pool-size: 1
    shutdown-timeout-seconds: 30
    thread-name-prefix: "RequestForceConfirmingPool-"
    is-wait-shutdown: true
  request-sender:
    pool-size: 1
    shutdown-timeout-seconds: 30
    thread-name-prefix: "RequestSenderPool-"
    is-wait-shutdown: true
  outbox-clearing:
    pool-size: 1
    shutdown-timeout-seconds: 30
    thread-name-prefix: "OutboxClearingPool-"
    is-wait-shutdown: true

scheduled-setting:
  request-force-confirming:
    cron: "0 */5 * * * *"
  request-sender:
    cron: "*/5 * * * * *"
  outbox-clearing:
    cron: "0 0 * * * *"

payment-setting:
  minutes-to-auto-confirmation: 120
