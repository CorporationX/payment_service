spring:
  config:
    import: optional:classpath:application.properties

  jackson:
    default-property-inclusion: non_null

  profiles:
    active: ${APP_ENV}

server:
  port: 9080

logging:
  level:
    root: info

openexchangerates:
  url: https://openexchangerates.org
  app-id: ${OPEN_EXCHANGE_APP_ID}

app:
  commission-rate: 0.01
  target-currency: RUB
  verification-code:
    min: 1000
    max: 10000