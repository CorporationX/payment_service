server:
  port: 9080

spring:
  config:
    import: 'optional:consul:'
  application:
    name: payment-service
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery: payment-service-i1

logging:
  file:
    name: logs/payment-service.log
  level:
    root: info

management:
  endpoints:
    web:
      exposure:
        include: "*"
    health:
      show-details: always

  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans