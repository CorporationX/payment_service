spring:
  data:
    redis:
      host: localhost
      port: 6379
      channel:
        pending_operation: pending_operation
  datasource:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://localhost:5432/postgres
      username: user
      password: password

  jpa:
      database-platform: org.hibernate.dialect.PostgreSQLDialect
      hibernate:
        ddl-auto: none
      show-sql: true
      properties:
        hibernate:
          format_sql: true

  liquibase:
      change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  clearing:
    job:
      interval: 10000

server:
  port: 9080

logging:
  level:
    root: info

retry:
  retry: 5
  delay: 3000

currency-api:
  url: https://api.exchangeratesapi.io/v1/
  api-key: YOUR_API_KEY_SET_IN_DOT_ENV_FILE
  base-currency: EUR
  redis-key: currencyRates
  cron: "00 30 09 * * *"
  timeout:
    connection: 5000
    read: 1000
