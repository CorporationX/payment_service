server:
  port: 9080

logging:
  level:
    root: info

oxr:
  app-id : "b16f7ad6bb084c27bd4f0ba4956a6e38"
  base-url : https://openexchangerates.org/api

currency:
  app-id: "938c71555bed985f7c114a33c00f6f97"
  base-url: https://api.exchangerate.host
  round-digits: 6

spring:
  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: account-group
    topics:
      transfer:
        publish:
          authorization-request-topic:
            name: authorize-requests
          clear-request-topic:
            name: clear-requests
          cancellation-request-topic:
            name: cancellation-requests
        consume:
          authorization-success-topic:
            name: authorization-success
            consumer-pool-size: 5
          authorization-failed-topic:
            name: authorization-failed
            consumer-pool-size: 5
          clearing-success-topic:
            name: clear-success
            consumer-pool-size: 5
          clearing-failed-topic:
            name: clear-failed
            consumer-pool-size: 5
          cancellation-success-topic:
            name: cancellation-success
            consumer-pool-size: 5
          cancellation-failed-topic:
            name: cancellation-failed
            consumer-pool-size: 5
      dead-letters:
        transfer-dead-letters-topic:
          name: transfer-dead-letters
          default-attempts: 1
          default-interval-millis: 100

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

clearing:
  transfers:
    cron: "*/15 * * * * *"
    batch_size: 200
  executor:
    thread_pool_max_size: 1000
    thread_pool_core_size: 500
