spring:
  data:
    redis:
      host: localhost
      port: 6379
      channel:
        pending_operation: pending_operation

  kafka:
    bootstrap-servers: host.docker.internal:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    template:
      default-topic: pending_operation
    topic:
      pending_operation: pending_operation
  profiles:
    active: redis

  datasource:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://localhost:5432/postgres
      username: user
      password: password

  jpa:
      database-platform: org.hibernate.dialect.PostgreSQLDialect
      hibernate:
        ddl-auto: none
      show-sql: true
      properties:
        hibernate:
          format_sql: true

  liquibase:
      change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  clearing:
    job:
      interval: 100000

server:
  port: 9080

logging:
  level:
    root: info

retry:
  retry: 5
  delay: 3000

account-service:
  host: localhost
  port: 8090


currency-api:
  url: https://api.exchangeratesapi.io/v1/
  api-key: YOUR_API_KEY_SET_IN_DOT_ENV_FILE
  base-currency: EUR
  redis-key: currencyRates
  cron: "00 30 09 * * *"
  timeout:
    connection: 5000
    read: 1000
