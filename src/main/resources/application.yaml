server:
  port: 9080

logging:
  level:
    root: info

app:
  currencyrates:
    retry:
      delay: 3000
      multiplier: 2
    cron:
      schedule: "0 0 * * * ?"
  api:
    exchangerates:
      baseUrl: "https://api.exchangeratesapi.io"
      accessKey: "3c578daa0956702bb77b51453b5b67c4"

spring:
  kafka:
    producer:
      bootstrap-servers: "localhost:9092"
      enable.idempotence: true
      acks: all
      max-in-flight-per-connection: 1
      transaction-id-prefix: "payment-service-"
      isolation.level: "read-committed"

      topics:
        premium:
          payment-response-topic: "premium-payment-response-topic"
          price-response-topic: "premium-price-response-topic"

    consumer:
      enable-auto-commit: false
      isolation.level: "read-committed"
      auto.offset.reset: "latest"

      topics:
        premium:
          payment-request-topic: "premium-payment-request-topic"
          price-request-topic: "premium-price-request-topic"

      groups:
        premium:
          payment-request-group: "premium-payment-request-group"
          price-request-group: "premium-price-request-group"

      correlation:
        premium-price: "premium-price-correlation-id"
        premium-payment: "premium-payment-correlation-id"

    listener:
      ack-mode: "manual"

