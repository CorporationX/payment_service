spring:
  data:
    redis:
      port: 6379
      host: localhost
      channels:
        paymentAuthPendingChannel:
          name: payment_auth_pending_channel
        paymentAuthErrorChannel:
          name: payment_auth_error_channel
        paymentAuthSuccessChannel:
          name: payment_auth_success_channel

        paymentConfirmPendingChannel:
          name: payment_confirm_pending_channel
        paymentConfirmErrorChannel:
          name: payment_confirm_error_channel
        paymentConfirmSuccessChannel:
          name: payment_confirm_success_channel

        paymentCancelPendingChannel:
          name: payment_cancel_pending_channel
        paymentCancelErrorChannel:
          name: payment_cancel_error_channel
        paymentCancelSuccessChannel:
          name: payment_cancel_success_channel

        paymentClearPendingChannel:
          name: payment_clear_pending_channel
        paymentClearErrorChannel:
          name: payment_clear_error_channel
        paymentClearSuccessChannel:
          name: payment_clear_success_channel

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 9080

logging:
  level:
    root: info

currency:
  rate:
    baseUrl: "https://api.exchangeratesapi.io/v1/"
    api-key: 3c0b2cc6c39dad86a64e12fe714386ca
    fetch-cron: "0 0 0 * * *"
    base: "USD"
    symbols: "GBP,JPY,EUR"
  openexchangerates:
    appId: 5e598dec046041949f35f8bbc05df98f
  baseCurrencyPayment: EUR
  commission: 0.01

exchange:
  rates:
    url: openexchangerates.org/api

payment-clearing-scheduler:
  cron: "0 */10 * * * *" # every 5 minute