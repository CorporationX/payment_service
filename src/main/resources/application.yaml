server:
  port: 9080

logging:
  level:
    root: info

scheduler:
  cron: "0 21 12 * * *"
  zone: "Europe/Moscow"

data:
  redis:
    port: 6379
    host: localhost
    channels:
      payment: payment_topic

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

services:
  account-service:
    host: http://localhost
    port: 8090


currency-api:
  baseUrl: "http://api.exchangeratesapi.io/v1/"
  key: "5f007739f6184c765fe4dc0cf07d0984"