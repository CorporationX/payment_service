server:
  port: 9080

spring:
  config:
    import: 'optional:consul:'
  application:
    name: payment-service
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery: payment-service-i1

logging:
  level:
    root: info

open_exchange_api:
  base-url: https://openexchangerates.org/api/
  app-id: PUT YOUR APP ID!!!!

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000