spring:
  config:
    import: optional:classpath:application.properties

  jackson:
    default-property-inclusion: non_null

  profiles:
    active: ${APP_ENV}

server:
  port: 9080

logging:
  level:
    root: info

current-rate:
  time-to-invoke: 0 0 12 * * *
  base-url-rate: "https://www.cbr-xml-daily.ru/daily"
  retry-delay: 2000
  count-invoke: 3


openexchangerates:
  url: https://openexchangerates.org
  app-id: ${OPEN_EXCHANGE_APP_ID}

app:
  commission-rate: 0.01
  target-currency: RUB
  verification-code:
    min: 1000
    max: 10000